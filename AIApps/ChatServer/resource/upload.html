<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CppAI · 图像识别</title>
    <style>
        :root {
            --bg: #0f1115;
            --bg-elev: #171a21;
            --border: rgba(255, 255, 255, 0.08);
            --text: #e8eaed;
            --muted: #9aa3b2;
            --accent: #6b8afd;
            --user-bg: #2a3558;
            --ai-bg: #1c2029;
            --radius: 16px;
            --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: var(--font);
            color: var(--text);
            background: var(--bg);
        }
        .top-bar {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }
        .back-btn {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-elev);
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: min(640px, 86%);
            padding: 12px 14px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 14px;
        }
        .user { background: var(--user-bg); align-self: flex-end; }
        .assistant {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
        }
        .message img {
            max-width: 220px;
            border-radius: 8px;
            display: block;
            margin-top: 8px;
        }
        .input-box {
            display: flex;
            padding: 12px 16px 18px;
            gap: 10px;
            border-top: 1px solid var(--border);
        }
        input[type="file"] {
            flex: 1;
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 8px 10px;
            background: var(--bg-elev);
            color: var(--text);
            font-family: inherit;
        }
        button[type="submit"] {
            padding: 0 18px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='/menu'">返回</button>
    </div>
    <div class="chat-container" id="chat-container"></div>
    <form class="input-box" id="upload-form">
        <input type="file" id="image-input" accept="image/*" required>
        <button type="submit">发送图片</button>
    </form>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const uploadForm = document.getElementById('upload-form');
        const imageInput = document.getElementById('image-input');

        function appendMessage(role, content, imageUrl = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);
            msgDiv.textContent = content;
            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                msgDiv.appendChild(img);
            }
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!imageInput.files.length) return;
            const file = imageInput.files[0];
            const reader = new FileReader();
            reader.onload = async function (event) {
                const base64Url = event.target.result;
                const base64Data = base64Url.split(',')[1];
                appendMessage('user', '已上传：' + file.name, base64Url);
                try {
                    const response = await fetch('/upload/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, image: base64Data })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.message || '上传失败');
                    }
                    const name = data.class_name || '未知';
                    const conf = Number(data.confidence);
                    const confText = Number.isFinite(conf) && conf > 0
                        ? '（置信度 ' + Math.round(conf * 100) + '%）'
                        : '';
                    appendMessage('assistant', '识别结果: ' + name + confText);
                } catch (err) {
                    appendMessage('assistant', '[错误] ' + err.message);
                }
                imageInput.value = '';
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
