<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CppAI · 对话</title>
    <style>
        :root {
            --bg: #0f1115;
            --bg-elev: #171a21;
            --bg-sidebar: #12151b;
            --border: rgba(255, 255, 255, 0.08);
            --text: #e8eaed;
            --muted: #9aa3b2;
            --accent: #6b8afd;
            --accent-hover: #849cff;
            --user-bg: #2a3558;
            --ai-bg: #1c2029;
            --radius: 16px;
            --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            font-family: var(--font);
            color: var(--text);
            background: var(--bg);
        }
        .session-list {
            width: 260px;
            display: flex;
            flex-direction: column;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
        }
        .session-list-header {
            padding: 18px 16px 12px;
            font-weight: 650;
            font-size: 14px;
            color: var(--muted);
        }
        .new-chat-btn, .top-bar button, button[type="submit"], .tts-btn {
            font-family: inherit;
            border: none;
            cursor: pointer;
        }
        .new-chat-btn {
            width: calc(100% - 32px);
            margin: 0 16px 12px;
            padding: 10px 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .new-chat-btn:hover { background: var(--accent-hover); }
        .session-list ul {
            list-style: none;
            padding: 0 8px 16px;
            margin: 0;
            flex: 1;
            overflow-y: auto;
        }
        .session-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 4px;
            overflow: hidden;
        }
        .session-list li.active, .session-list li:hover {
            background: rgba(107, 138, 253, 0.14);
            color: var(--text);
        }
        .session-title {
            min-width: 0;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-status {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .session-status.done {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(107, 138, 253, 0.2);
        }
        .session-status.thinking::before {
            content: "⠋";
            font-family: ui-monospace, "Cascadia Mono", "Segoe UI", Consolas, monospace;
            font-size: 12px;
            line-height: 1;
            color: var(--accent);
            animation: dots-spin 0.8s linear infinite;
        }
        @keyframes dots-spin {
            0% { content: "⠋"; }
            10% { content: "⠙"; }
            20% { content: "⠹"; }
            30% { content: "⠸"; }
            40% { content: "⠼"; }
            50% { content: "⠴"; }
            60% { content: "⠦"; }
            70% { content: "⠧"; }
            80% { content: "⠇"; }
            90% { content: "⠏"; }
            100% { content: "⠋"; }
        }
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .top-bar {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 17, 21, 0.9);
        }
        .top-bar button, .top-bar select {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
        }
        .top-bar button {
            background: var(--bg-elev);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .sources {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .sources span {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(107, 138, 253, 0.1);
            color: var(--text);
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .welcome {
            margin: auto;
            text-align: center;
            color: var(--muted);
            max-width: 420px;
        }
        .welcome h2 { color: var(--text); font-weight: 600; margin-bottom: 8px; }
        .message {
            max-width: min(720px, 86%);
            padding: 12px 14px;
            border-radius: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 14.5px;
        }
        .message .meta {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .message .body { flex: 1; min-width: 0; }
        .message .body p { margin: 0.4em 0; }
        .user {
            background: var(--user-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .assistant {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .thinking {
            color: var(--muted);
            font-style: italic;
        }
        .input-box {
            display: flex;
            padding: 12px 16px 18px;
            gap: 10px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            min-height: 48px;
            max-height: 160px;
            resize: none;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
            border: 1px solid var(--border);
            background: var(--bg-elev);
            color: var(--text);
            font-family: inherit;
        }
        textarea:focus { border-color: var(--accent); }
        button[type="submit"] {
            height: 48px;
            padding: 0 18px;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .tts-btn {
            flex-shrink: 0;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .tts-btn:hover { color: var(--text); }
        .tts-btn.busy { opacity: 0.85; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.0/dist/purify.min.js"></script>
</head>
<body>
    <div class="session-list">
        <div class="session-list-header">会话</div>
        <button class="new-chat-btn" id="newChatBtn">新对话</button>
        <ul id="sessionList"></ul>
    </div>
    <div class="chat-section">
        <div class="top-bar">
            <button type="button" id="back-btn">返回</button>
            <button type="button" id="sync-history-btn">同步历史</button>
        </div>
        <div class="chat-container" id="chat-container">
            <div class="welcome" id="welcome">
                <h2>开始对话</h2>
                <p>需要时会检索本地知识库或联网搜索。请到工作台「知识库」上传 .txt/.md。</p>
            </div>
        </div>
        <form class="input-box" id="chat-form">
            <textarea id="question" placeholder="输入消息，Enter 发送，Shift+Enter 换行" required></textarea>
            <button type="submit" id="send-btn">发送</button>
        </form>
    </div>
    <script>
        let currentSessionId = null;
        const sessions = {};
        const pendingTimers = {};
        const sessionList = document.getElementById('sessionList');
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const questionInput = document.getElementById('question');
        const syncBtn = document.getElementById('sync-history-btn');
        const newChatBtn = document.getElementById('newChatBtn');
        const sendBtn = document.getElementById('send-btn');
        const backBtn = document.getElementById('back-btn');

        const LAST_SESSION_KEY = 'cppai.lastSessionId';

        function rememberSession() {
            try {
                if (currentSessionId) {
                    sessionStorage.setItem(LAST_SESSION_KEY, currentSessionId);
                } else {
                    sessionStorage.removeItem(LAST_SESSION_KEY);
                }
            } catch (_) {}
        }

        function rememberedSession() {
            try { return sessionStorage.getItem(LAST_SESSION_KEY); } catch (_) { return null; }
        }

        function putSession(id, data, atTop) {
            if (!atTop || sessions[id]) {
                sessions[id] = Object.assign(sessions[id] || { name: '新会话', messages: [], pending: false }, data);
                return sessions[id];
            }
            const prev = Object.assign({}, sessions);
            Object.keys(sessions).forEach((key) => { delete sessions[key]; });
            sessions[id] = Object.assign({ name: '新会话', messages: [], pending: false }, data);
            Object.assign(sessions, prev);
            return sessions[id];
        }

        function syncSendButton() {
            const item = currentSessionId ? sessions[currentSessionId] : null;
            sendBtn.disabled = !!(item && item.pending);
        }

        function showEmptyWelcome(title, text) {
            chatContainer.innerHTML =
                '<div class="welcome" id="welcome"><h2>' + title + '</h2><p>' + text + '</p></div>';
        }

        function uniqueSources(list) {
            if (!Array.isArray(list)) return [];
            const names = [];
            list.forEach((item) => {
                const name = item && typeof item === 'object' ? item.source : item;
                if (name && !names.includes(name)) names.push(name);
            });
            return names;
        }

        function hideWelcome() {
            const el = document.getElementById('welcome');
            if (el) el.remove();
        }

        const ttsPlayer = {
            abort: null,
            audio: null,
            btn: null,
            objectUrls: []
        };

        function unlockAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!window.__ttsCtx) window.__ttsCtx = new AC();
                if (window.__ttsCtx.state === 'suspended') window.__ttsCtx.resume();
            } catch (_) {}
        }

        function stopTTS() {
            if (ttsPlayer.abort) ttsPlayer.abort.abort();
            ttsPlayer.abort = null;
            if (ttsPlayer.audio) {
                ttsPlayer.audio.pause();
                ttsPlayer.audio.removeAttribute('src');
                ttsPlayer.audio.load();
            }
            ttsPlayer.objectUrls.forEach((u) => URL.revokeObjectURL(u));
            ttsPlayer.objectUrls = [];
            if (ttsPlayer.btn) {
                ttsPlayer.btn.classList.remove('busy');
                ttsPlayer.btn.textContent = '播放';
                ttsPlayer.btn = null;
            }
        }

        function splitForTts(text) {
            const max = 60;
            const firstMax = 24;
            const punct = new Set(['。', '！', '？', '；', '!', '?', ';', '\n']);
            const parts = [];
            let buf = '';
            let n = 0;
            const flush = () => {
                const t = buf.replace(/\s+/g, ' ').trim();
                if (t) parts.push(t);
                buf = '';
                n = 0;
            };
            for (const ch of String(text)) {
                buf += ch;
                n += 1;
                const limit = parts.length === 0 ? firstMax : max;
                if ((punct.has(ch) && n >= 8) || n >= limit) flush();
            }
            flush();
            return parts;
        }

        async function fetchTtsBlob(text, signal) {
            const res = await fetch('/chat/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                signal,
                body: JSON.stringify({ text })
            });
            const type = res.headers.get('content-type') || '';
            if (!res.ok || type.includes('application/json')) {
                let message = '无法获取语音';
                try {
                    const data = await res.json();
                    message = data.message || message;
                } catch (_) {}
                throw new Error(message);
            }
            const blob = await res.blob();
            if (blob.size < 128) {
                throw new Error('语音数据为空或不完整');
            }
            return blob;
        }

        const ttsPrefetch = new Map();

        function prefetchFirstTts(text) {
            const plain = String(text)
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/https?:\/\/\S+/g, ' ')
                .replace(/[#*_`>]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            const chunks = splitForTts(plain || text);
            if (!chunks[0] || ttsPrefetch.has(chunks[0])) return;
            const pending = fetchTtsBlob(chunks[0]);
            ttsPrefetch.set(chunks[0], pending);
            pending.catch(() => {
                if (ttsPrefetch.get(chunks[0]) === pending) {
                    ttsPrefetch.delete(chunks[0]);
                }
            });
            if (ttsPrefetch.size > 6) {
                const first = ttsPrefetch.keys().next().value;
                ttsPrefetch.delete(first);
            }
        }

        async function playTTS(text, btn) {
            if (!text) return;
            if (btn && ttsPlayer.btn === btn && ttsPlayer.abort) {
                stopTTS();
                return;
            }
            stopTTS();
            unlockAudio();

            const plain = String(text)
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/https?:\/\/\S+/g, ' ')
                .replace(/[#*_`>]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            const chunks = splitForTts(plain || text);
            if (!chunks.length) return;

            const abort = new AbortController();
            ttsPlayer.abort = abort;
            ttsPlayer.btn = btn || null;
            ttsPlayer.audio = new Audio();
            ttsPlayer.audio.preload = 'auto';
            ttsPlayer.objectUrls = [];
            if (btn) {
                btn.classList.add('busy');
                btn.textContent = '停止';
            }

            const waitEnded = (audio) => new Promise((resolve, reject) => {
                if (abort.signal.aborted) {
                    resolve();
                    return;
                }
                const cleanup = () => {
                    audio.removeEventListener('ended', done);
                    audio.removeEventListener('error', failed);
                    abort.signal.removeEventListener('abort', cancelled);
                };
                const done = () => {
                    cleanup();
                    resolve();
                };
                const failed = () => {
                    cleanup();
                    reject(new Error('浏览器无法解码百度返回的语音'));
                };
                const cancelled = () => {
                    cleanup();
                    resolve();
                };
                audio.addEventListener('ended', done);
                audio.addEventListener('error', failed);
                abort.signal.addEventListener('abort', cancelled);
            });

            try {
                let nextFetch = ttsPrefetch.has(chunks[0])
                    ? ttsPrefetch.get(chunks[0])
                    : fetchTtsBlob(chunks[0], abort.signal);
                ttsPrefetch.delete(chunks[0]);
                for (let i = 0; i < chunks.length; i++) {
                    const blob = await nextFetch;
                    if (abort.signal.aborted) return;
                    if (i + 1 < chunks.length) {
                        nextFetch = fetchTtsBlob(chunks[i + 1], abort.signal);
                    }
                    const url = URL.createObjectURL(blob);
                    ttsPlayer.objectUrls.push(url);
                    ttsPlayer.audio.src = url;
                    await ttsPlayer.audio.play();
                    await waitEnded(ttsPlayer.audio);
                }
            } catch (err) {
                if (err && err.name === 'AbortError') return;
                console.error(err);
                alert('[错误] ' + (err && err.message ? err.message : '请求语音接口失败'));
            } finally {
                if (ttsPlayer.abort === abort) {
                    if (btn) {
                        btn.classList.remove('busy');
                        btn.textContent = '播放';
                    }
                    ttsPlayer.btn = null;
                    ttsPlayer.abort = null;
                    ttsPlayer.objectUrls.forEach((u) => URL.revokeObjectURL(u));
                    ttsPlayer.objectUrls = [];
                }
            }
        }

        function appendMessage(role, content, opts = {}) {
            hideWelcome();
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);
            if (opts.thinking) msgDiv.classList.add('thinking');
            if (opts.id) msgDiv.id = opts.id;
            const safeHtml = opts.thinking
                ? content
                : DOMPurify.sanitize(marked.parse(content || ''));
            const body = document.createElement('div');
            body.className = 'body';
            body.innerHTML = safeHtml;
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.appendChild(body);
            if (!opts.thinking && content) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tts-btn';
                btn.textContent = '播放';
                btn.addEventListener('click', () => playTTS(content, btn));
                meta.appendChild(btn);
                if (opts.prefetch) prefetchFirstTts(content);
            }
            msgDiv.appendChild(meta);
            const sourceNames = uniqueSources(opts.sources);
            if (!opts.thinking && sourceNames.length) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.appendChild(document.createTextNode('引用'));
                sourceNames.forEach((name) => {
                    const chip = document.createElement('span');
                    chip.textContent = name;
                    srcDiv.appendChild(chip);
                });
                msgDiv.appendChild(srcDiv);
            }
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function clearMessages() { chatContainer.innerHTML = ''; }

        function renderSessionList() {
            sessionList.innerHTML = '';
            for (let id in sessions) {
                const item = sessions[id];
                const li = document.createElement('li');
                const name = item.name || '新会话';
                const status = document.createElement('span');
                status.className = 'session-status';
                if (item.pending) {
                    status.classList.add('thinking');
                    status.title = '正在思考';
                } else if ((item.messages && item.messages.length) || item.hasMessages) {
                    status.classList.add('done');
                    status.title = '已完成';
                }
                const title = document.createElement('span');
                title.className = 'session-title';
                title.textContent = name;
                li.title = name;
                li.dataset.id = id;
                if (id === currentSessionId) li.classList.add('active');
                li.appendChild(status);
                li.appendChild(title);
                li.onclick = () => switchSession(id);
                sessionList.appendChild(li);
            }
        }

        function stopPendingPoll(sessionId) {
            if (sessionId) {
                if (pendingTimers[sessionId]) {
                    clearTimeout(pendingTimers[sessionId]);
                    delete pendingTimers[sessionId];
                }
                return;
            }
            Object.keys(pendingTimers).forEach((id) => {
                clearTimeout(pendingTimers[id]);
                delete pendingTimers[id];
            });
        }

        async function fetchHistory(sessionId) {
            try {
                const res = await fetch('/chat/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ sessionId })
                });
                if (res.status === 401) {
                    sessionStorage.clear();
                    window.location.href = '/entry';
                    return null;
                }
                const data = await res.json();
                if (!data.success || !Array.isArray(data.history)) return null;
                return data;
            } catch (err) {
                console.error('获取历史失败', err);
                return null;
            }
        }

        function applyHistory(id, data) {
            if (!sessions[id]) putSession(id, {});
            const messages = data.history.map(item => ({
                role: item.is_user ? 'user' : 'assistant',
                content: item.content
            }));
            sessions[id].messages = messages;
            sessions[id].pending = !!data.pending;
            sessions[id].hasMessages = messages.length > 0;
            if (data.pending && data.pendingQuestion) {
                sessions[id].pendingQuestion = data.pendingQuestion;
                sessions[id].name = data.pendingQuestion.slice(0, 24) || sessions[id].name;
            } else {
                sessions[id].pendingQuestion = '';
            }
            renderSessionList();
            if (sessions[id].pending) schedulePendingPoll(id);
            else stopPendingPoll(id);
        }

        function renderSessionView(id) {
            if (currentSessionId !== id || !sessions[id]) return;
            const item = sessions[id];
            clearMessages();
            if (!item.messages.length && !item.pending) {
                showEmptyWelcome('新对话', '默认会检索本地知识库后再回答，可在顶栏关闭。');
                return;
            }
            item.messages.forEach((m, idx, arr) => {
                appendMessage(m.role, m.content, {
                    prefetch: !item.pending && idx === arr.length - 1 && m.role === 'assistant',
                    sources: m.sources
                });
            });
            if (item.pending) {
                const last = item.messages[item.messages.length - 1];
                if (!last || last.role !== 'user' || last.content !== item.pendingQuestion) {
                    appendMessage('user', item.pendingQuestion || '');
                }
                appendMessage('assistant', '正在思考…', { thinking: true });
            }
        }

        function schedulePendingPoll(sessionId) {
            stopPendingPoll(sessionId);
            pendingTimers[sessionId] = setTimeout(async () => {
                delete pendingTimers[sessionId];
                const data = await fetchHistory(sessionId);
                if (!data || !sessions[sessionId]) return;
                applyHistory(sessionId, data);
                if (currentSessionId === sessionId) renderSessionView(sessionId);
                syncSendButton();
            }, 1500);
        }

        async function switchSession(id) {
            const sessionId = String(id);
            currentSessionId = sessionId;
            rememberSession();
            if (!sessions[sessionId]) putSession(sessionId, { name: '会话' });
            renderSessionList();
            syncSendButton();
            renderSessionView(sessionId);
            const data = await fetchHistory(sessionId);
            if (currentSessionId !== sessionId) return;
            if (data) {
                applyHistory(sessionId, data);
                renderSessionView(sessionId);
            }
            syncSendButton();
        }

        async function createRemoteSession() {
            const res = await fetch('/chat/new-session', {
                method: 'POST',
                credentials: 'same-origin'
            });
            if (res.status === 401) {
                sessionStorage.clear();
                window.location.href = '/entry';
                throw new Error('Unauthorized');
            }
            const data = await res.json();
            if (!res.ok || !data.success || !data.sessionId) {
                throw new Error(data.message || '无法创建会话');
            }
            return String(data.sessionId);
        }

        newChatBtn.addEventListener('click', async () => {
            newChatBtn.disabled = true;
            try {
                const sessionId = await createRemoteSession();
                putSession(sessionId, { name: '新会话', messages: [], pending: false }, true);
                currentSessionId = sessionId;
                rememberSession();
                showEmptyWelcome('新对话', '默认会检索本地知识库后再回答，可在顶栏关闭。');
                renderSessionList();
                syncSendButton();
                questionInput.focus();
            } catch (err) {
                console.error(err);
                alert('[错误] ' + (err && err.message ? err.message : '无法创建新对话'));
            } finally {
                newChatBtn.disabled = false;
            }
        });

        backBtn.addEventListener('click', () => {
            rememberSession();
            window.location.href = '/menu';
        });

        window.addEventListener('pagehide', rememberSession);

        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        chatForm.addEventListener('submit', async e => {
            e.preventDefault();
            const question = questionInput.value.trim();
            if (!question) return;

            let sessionId = currentSessionId;
            if (!sessionId || !sessions[sessionId]) {
                try {
                    sessionId = await createRemoteSession();
                    putSession(sessionId, { name: '新会话', messages: [], pending: false }, true);
                    currentSessionId = sessionId;
                    rememberSession();
                    renderSessionList();
                } catch (err) {
                    alert('[错误] ' + (err && err.message ? err.message : '无法创建会话'));
                    return;
                }
            }

            const item = sessions[sessionId];
            if (item.pending) return;

            item.pending = true;
            item.pendingQuestion = question;
            item.name = question.slice(0, 24) || item.name || '新会话';
            item.messages = item.messages || [];
            renderSessionList();
            syncSendButton();
            questionInput.value = '';
            if (currentSessionId === sessionId) {
                hideWelcome();
                appendMessage('user', question);
                appendMessage('assistant', '正在思考…', { thinking: true });
            }

            try {
                const response = await fetch('/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ question, sessionId })
                });
                const data = await response.json().catch(() => ({}));
                if (response.status === 401 || data.message === 'Unauthorized') {
                    sessionStorage.clear();
                    window.location.href = '/entry';
                    return;
                }
                const stillHere = currentSessionId === sessionId;
                if (response.ok && data.success) {
                    const sources = Array.isArray(data.sources) ? data.sources : [];
                    const last = item.messages[item.messages.length - 1];
                    if (!last || last.role !== 'user' || last.content !== question) {
                        item.messages.push({ role: 'user', content: question });
                    }
                    item.messages.push({ role: 'assistant', content: data.Information, sources });
                    item.pending = false;
                    item.pendingQuestion = '';
                    item.hasMessages = true;
                    stopPendingPoll(sessionId);
                    renderSessionList();
                    if (stillHere) renderSessionView(sessionId);
                } else {
                    item.pending = false;
                    item.pendingQuestion = '';
                    stopPendingPoll(sessionId);
                    renderSessionList();
                    if (stillHere) {
                        renderSessionView(sessionId);
                        appendMessage('assistant', '[错误] ' + (data.message || data.Information || ('HTTP ' + response.status)));
                    }
                }
            } catch (err) {
                console.error(err);
                item.pending = false;
                item.pendingQuestion = '';
                stopPendingPoll(sessionId);
                renderSessionList();
                if (currentSessionId === sessionId) {
                    renderSessionView(sessionId);
                    appendMessage('assistant', '[错误] 无法连接到服务器');
                }
            } finally {
                syncSendButton();
                if (currentSessionId === sessionId) questionInput.focus();
            }
        });

        syncBtn.addEventListener('click', async () => {
            if (!currentSessionId) {
                alert('请选择已有会话进行同步');
                return;
            }
            const sessionId = currentSessionId;
            const data = await fetchHistory(sessionId);
            if (!data) {
                alert('[错误] 无法获取历史数据');
                return;
            }
            applyHistory(sessionId, data);
            if (currentSessionId === sessionId) renderSessionView(sessionId);
            syncSendButton();
        });

        async function loadSessions() {
            try {
                const res = await fetch('/chat/sessions', { credentials: 'same-origin' });
                const data = await res.json();
                if (!data.success || !Array.isArray(data.sessions)) return;
                let pendingId = null;
                data.sessions.slice().reverse().forEach(s => {
                    const sid = String(s.sessionId);
                    const prev = sessions[sid] || {};
                    putSession(sid, {
                        name: s.name || prev.name || '新会话',
                        messages: prev.messages || [],
                        pending: !!s.pending,
                        hasMessages: !!(s.hasMessages || (prev.messages && prev.messages.length) || prev.hasMessages)
                    });
                    if (s.pending) pendingId = sid;
                });
                renderSessionList();
                Object.keys(sessions).forEach((sid) => {
                    if (sessions[sid].pending) schedulePendingPoll(sid);
                });
                const remembered = rememberedSession();
                const restore = remembered && sessions[remembered] ? remembered : pendingId;
                if (restore) await switchSession(restore);
                syncSendButton();
            } catch (err) {
                console.error('获取会话列表失败', err);
            }
        }
        loadSessions();
    </script>
</body>
</html>
